[project]
name = "idi-shipstation-sdk"
version = "1.5.0"
description = "ShipStation API SDK"
authors = [
    { name = "Bradley Reynolds", email = "bradley.reynolds@impressdesigns.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = ["pydantic>=2.14.1", "niquests>=3.21.2"]

[project.urls]
repository = "https://github.com/impressdesigns/shipstation-sdk/"
documentation = "https://impressdesigns.dev/shipstation-sdk/"

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    # DX
    "nox>=2026.10.20",
    "pre-commit>=4.7.0",
    # Linters
    "ruff>=0.17.1",
    "mypy>=2.4.0",
]
docs = [
    "sphinx>=9.2.0",
    # Theme
    "furo>=2025.12.19",
    # Extensions
    "sphinx-autoapi>=3.8.1",
    "releases>=2.1.1",
]
tests = [
    "coverage>=7.16.2",
    "pytest>=9.1.1",
    # Extensions
    "pytest-randomly>=5.0.0",
]

[tool.uv]
# certifi 2026.10.19 is the release that distrusts the compromised eMudhra/emSign
# intermediates (October 2026); it is exempt from exclude-newer until it ages past the window.
constraint-dependencies = ["certifi>=2026.10.19"]

[tool.uv.build-backend]
module-name = "shipstation_sdk"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "CPY001", # (Missing copyright notice at top of file) - No license
]

[tool.ruff.lint.extend-per-file-ignores]
"docs/*" = [
    "INP001", # (File `docs/conf.py` is part of an implicit namespace package. Add an `__init__.py`.) - Docs are not modules
]
"tests/*" = [
    "S101", # (Use of `assert` detected) - Yes, that's the point
    "PLR2004", # (Magic value used in comparison) - Tests compare against fixture values
]

[tool.ruff.lint.isort]
known-first-party = ["shipstation_sdk"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["shipstation_sdk"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
